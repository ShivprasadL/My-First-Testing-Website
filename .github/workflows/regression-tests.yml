name: TestNG QA Automation Pipeline

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch: 

# Grants explicit write permissions so the reporting engine can post summaries
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  run-automation-suite:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository Source Code
      uses: actions/checkout@v4

    - name: Setup Java JDK Environment
      uses: actions/setup-java@v4
      with:
        java-version: '17'            
        distribution: 'temurin'       
        cache: 'maven'                

    - name: Execute Automation Tests
      run: mvn clean test

    # Optimized to scan exclusively for compatible Surefire JUnit report files
    - name: Publish Test Reports Summary
      uses: EnricoMi/publish-unit-test-result-action/composite@v2
      if: always() 
      with:
        files: '**/target/surefire-reports/TEST-*.xml'